name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  agent:
    name: Agent tests
    # The agent is stdlib-only on purpose -- nothing to pip install on a Pi --
    # so it is worth proving that across the versions a Pi might be running.
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install pytest

      - name: Run agent tests
        working-directory: agent
        run: python -m pytest -q test_xl1_heartbeat.py

  receiver:
    name: Receiver tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            receiver/requirements.txt
            receiver/requirements-dev.txt

      - name: Install dependencies
        working-directory: receiver
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # These pin the three properties the receiver exists to demonstrate:
      # ingest is closed to strangers, block accounting cannot be inflated by a
      # replay, and the public view is an allow-list.
      - name: Run receiver tests
        working-directory: receiver
        env:
          NODE_HEARTBEAT_TOKEN: test-token
        run: python -m pytest -q

  shellcheck:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rebuild-xl1-image.sh runs as root, weekly, unattended, against a live
      # block producer. A quoting mistake there fails at 4am on a Sunday with
      # nobody watching, which is the case worth catching in advance.
      #
      # No --severity relaxation: the script is clean at the default level, so
      # the gate is set where it actually is rather than where it is easy.
      - name: Check scripts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck agent/rebuild-xl1-image.sh
